name: Tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  pest:
    name: Pest (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4', '8.5']
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@2.40.0
        with:
          php-version: ${{ matrix.php }}
          extensions: bcmath, curl, dom, gd, intl, mbstring, pdo_mysql, zip
          tools: composer:v2
          coverage: none
      - run: composer install --prefer-dist --no-interaction
      - run: composer check

  required:
    name: Package checks
    runs-on: ubuntu-latest
    timeout-minutes: 2
    if: ${{ always() }}
    needs: pest
    steps:
      - name: Require all supported PHP versions to pass
        run: test "$RESULT" = success
        env:
          RESULT: ${{ needs.pest.result }}
